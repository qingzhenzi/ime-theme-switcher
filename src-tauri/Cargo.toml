[package]
name = "ime-theme-switcher"
version = "0.2.0"
description = "切换 fcitx5 候选框主题、体检与初始化输入法环境的 Tauri 小工具"
authors = ["qingzhenzi"]
license = "MIT"
repository = "https://github.com/qingzhenzi/ime-theme-switcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
